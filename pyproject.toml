[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyvbaanalysis"
dynamic = ["version"]
description = "Pure-Python static analysis for Excel VBA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Smith Edward" }]
keywords = ["vba", "static-analysis", "linter", "excel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# pyOpenVBA reads VBA from Office files; defusedxml protects the saved workbook
# metadata reader from XML entity expansion. Both dependencies are pure Python.
#
# The floor is a correctness requirement, not just currency. 3.4.0 resolves a
# VBA project's code page correctly (earlier, text in a non-Latin project
# decoded as mojibake the analyzer then read as identifiers). 3.5.0 added
# forms(), the UserForm designer read that gives a form's controls; without it
# every control the code-behind names is undeclared. 6.3.3 is the release the
# reader is tested against.
dependencies = ["pyOpenVBA>=6.3.3", "defusedxml==0.7.1"]

[project.optional-dependencies]
# Exact pins: CI is a regression gate, so the toolchain must not drift
# underneath main (ruff 0.16 broke a green tree with zero repo commits).
# Dependabot's weekly pip updates turn each tool upgrade into its own gated
# PR, where a red CI run blocks the bump instead of breaking main.
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[project.scripts]
pyvbaanalysis = "pyvbaanalysis.cli:main"

[project.urls]
Homepage = "https://github.com/WilliamSmithEdward/pyVBAanalysis"
Repository = "https://github.com/WilliamSmithEdward/pyVBAanalysis"
Issues = "https://github.com/WilliamSmithEdward/pyVBAanalysis/issues"

# Single-source the version: hatchling reads __version__ from the package __init__,
# so the wheel metadata and pyvbaanalysis.__version__ cannot drift.
[tool.hatch.version]
path = "pyvbaanalysis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyvbaanalysis"]
# The oracle corpus and provenance audit are read only by the test suite, not at
# runtime, so keep them out of the published wheel (they stay in the sdist).
exclude = [
    "pyvbaanalysis/data/vbe_oracle_cases.json",
    "pyvbaanalysis/data/diagnostic_influence_audit.json",
]

[tool.hatch.build.targets.sdist]
# Keep internal development notes out of the published sdist. The evidence corpus
# stays in (the test suite needs it); only the agent/working notes are excluded,
# with the differential harness, which runs only against an XLIDE checkout.
exclude = [
    "agent.md",
    "docs/agentic_ai_programming_best_practices.md",
    "docs/AI-Smells-Agents-Avoid.md",
    "tools/differential/",
    # A legacy .ppt holding VBA, for the .ppt reader test. A published package
    # carries no macro file; the test skips when the fixture is absent.
    "tests/fixtures/PowerPointFixture.ppt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

# The lint contract this codebase is written against: pycodestyle errors plus
# Pyflakes (ruff's historical default). Pinned explicitly because ruff 0.16
# widened its default selection with rules that contradict deliberate patterns
# here (e.g. the engine's rule-isolation except blocks vs BLE001/S110).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true

# The reader's runtime dependencies ship no type stubs, so allow their imports.
[[tool.mypy.overrides]]
module = ["pyopenvba", "pyopenvba.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
