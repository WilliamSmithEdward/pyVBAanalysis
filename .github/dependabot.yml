version: 2
# Every pin keeps an updater. A new version is proposed once it is a week old
# (the cooldown), and each proposal runs CI, Security and Malware scan before merge.
# Not followed here: the YARA-X and YARA Forge release downloads, which
# update-yara-rules.yml moves in .github/security/yara.json, and the exact
# Python and runner versions in the workflows, which are moved by hand.
updates:
  # The GitHub Actions, pinned by commit SHA in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init, analyze and upload-sarif must move together: one job cannot mix
      # CodeQL action majors.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The Python tooling (exact pins in pyproject.toml) and the runtime dependency.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The CI tool locks (pip-audit, build), hash-pinned in .github/requirements.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The ClamAV and Semgrep engine images, pinned by digest.
  - package-ecosystem: docker
    directories:
      - /.github/security/clamav
      - /.github/security/semgrep
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
