version: 2
# Every pin keeps an updater. A new version is proposed once it is a week old
# (the cooldown), and each proposal runs CI, Security and Malware scan before merge.
# Not followed here: the YARA-X and YARA Forge release downloads, which
# update-yara-rules.yml moves in .github/security/yara.json, the ClamAV and
# Semgrep images, which update-images.yml moves because GitHub refuses
# Dependabot's image updates, and the exact
# Python and runner versions in the workflows, which are moved by hand.
updates:
  # The GitHub Actions, pinned by commit SHA in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init, analyze and upload-sarif must move together: one job cannot mix
      # CodeQL action majors.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Python tooling (exact pins in pyproject.toml) and the runtime dependency.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The CI tool locks (pip-audit, build), hash-pinned in .github/requirements.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
