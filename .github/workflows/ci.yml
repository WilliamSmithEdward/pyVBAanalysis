name: CI

# Run the lint, type, and test gate on every push to main and every pull request,
# so a regression is caught before it can reach a release.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy pyvbaanalysis

  # Job names carry the platform and the Python minor only: they are the
  # required status checks on main, so moving a pinned runner or patch version
  # must not rename them.
  languages:
    name: Language matrix (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            python: "3.12.14"
          - platform: Windows
            runner: windows-2025
            python: "3.12.10" # python.org ships no Windows build past 3.12.10 for 3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Runs on both platforms because the failure mode this guards is
      # encoding-shaped: a default locale or console code page that differs
      # between Linux and Windows must not change what the analyzer sees.
      - name: Language matrix
        run: python -m pytest tests/test_language_matrix.py -q

  test:
    name: Test (Python ${{ matrix.minor }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {minor: "3.10", python: "3.10.21"}
          - {minor: "3.11", python: "3.11.16"}
          - {minor: "3.12", python: "3.12.14"}
          - {minor: "3.13", python: "3.13.15"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
