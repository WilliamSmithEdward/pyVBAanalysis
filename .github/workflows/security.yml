name: Security

# Static security analysis: CodeQL (Python and the workflows themselves),
# Semgrep, and pip-audit over the runtime dependency tree. Any finding fails
# the run. Results go to the repository's Security tab as SARIF and to a
# `security-report` artifact, which publish.yml attaches to every release.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new advisories surface between pushes
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: codeql-${{ matrix.language }}
          output: sarif
      - name: Fail on any finding
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif/*.sarif)
          echo "CodeQL ${{ matrix.language }}: $count finding(s)"
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' sarif/*.sarif
          test "$count" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sarif-codeql-${{ matrix.language }}
          path: sarif/*.sarif

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "semgrep>=1,<2"
      - name: Scan (fails on any finding)
        run: >
          semgrep scan --metrics off --error
          --config p/python --config p/security-audit
          --config p/secrets --config p/github-actions
          --sarif-output semgrep.sarif --text
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sarif-semgrep
          path: semgrep.sarif

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install . pip-audit
      - name: Audit the installed runtime tree (fails on any known vulnerability)
        run: pip-audit --local --strict --format json --output pip-audit.json --progress-spinner off
      - if: always()
        run: pip-audit --local --strict --progress-spinner off || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pip-audit
          path: pip-audit.json

  report:
    name: Security report
    needs: [codeql, semgrep, dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: results
          merge-multiple: true
      - name: Write the report
        env:
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          DEPS: ${{ needs.dependencies.result }}
        run: |
          count() { if [ -f "$1" ]; then jq '[.runs[].results[]] | length' "$1"; else echo "not run"; fi; }
          vulns=$(if [ -f results/pip-audit.json ]; then jq '[.dependencies[].vulns[]] | length' results/pip-audit.json; else echo "not run"; fi)
          {
            echo "# Security report"
            echo
            echo "Commit \`${GITHUB_SHA}\`, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Check | Result | Findings |"
            echo "| --- | --- | --- |"
            echo "| CodeQL (Python, security-extended) | $CODEQL | $(count results/python.sarif) |"
            echo "| CodeQL (GitHub Actions) | $CODEQL | $(count results/actions.sarif) |"
            echo "| Semgrep (python, security-audit, secrets, github-actions) | $SEMGREP | $(count results/semgrep.sarif) |"
            echo "| pip-audit (runtime dependencies) | $DEPS | $vulns |"
          } > security-report.md
          mkdir -p report && cp security-report.md report/ && cp results/*.sarif results/*.json report/ 2>/dev/null || true
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-report
          path: report/
