name: Security

# Static security analysis: CodeQL (Python and the workflows themselves),
# Semgrep and pip-audit over the runtime dependency tree, and zizmor over the
# workflows. Any finding fails the run. The malware scan (ClamAV and YARA-X) is in malware-scan.yml.
# Results go to the repository's Security tab as SARIF and to a
# `security-report` artifact, which publish.yml attaches to every release.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily, so new advisories surface between pushes
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: codeql-${{ matrix.language }}
          output: sarif
      - name: Fail on any finding
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif/*.sarif)
          echo "CodeQL $LANGUAGE: $count finding(s)"
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' sarif/*.sarif
          test "$count" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-codeql-${{ matrix.language }}
          path: sarif/*.sarif

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The engine is pinned by digest (.github/security/semgrep); the registry
      # rule sets are fetched fresh on every run.
      - run: docker build -t semgrep-pinned .github/security/semgrep
      - name: Scan (fails on any finding)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep-pinned
          semgrep scan --metrics off --error
          --config p/python --config p/security-audit
          --config p/secrets --config p/github-actions
          --sarif-output semgrep.sarif --text
      # Code scanning does not read SARIF suppressions, so a line marked
      # nosemgrep (each one listed in SECURITY.md) would stay an open alert.
      # Only unsuppressed results are uploaded; semgrep.sarif keeps them all.
      - name: Drop suppressed results for code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        run: jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep-upload.sarif
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('semgrep-upload.sarif') != ''
        with:
          sarif_file: semgrep-upload.sarif
          category: semgrep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-semgrep
          path: semgrep.sarif

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      # The runtime tree without pyvbaanalysis itself, whose version is not on
      # PyPI until the release that ships it; frozen before pip-audit is added.
      # pip-audit runs from its own venv, installed from hash-pinned requirements
      # (.github/requirements/pip-audit.txt, which Dependabot updates).
      - run: |
          python -m pip install .
          python -m pip freeze --exclude pyvbaanalysis > runtime.txt
          cat runtime.txt
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --require-hashes -r .github/requirements/pip-audit.txt
      - name: Audit the runtime dependencies (fails on any known vulnerability)
        run: >
          "$RUNNER_TEMP/audit/bin/pip-audit" --strict --no-deps -r runtime.txt
          --format json --output pip-audit.json --progress-spinner off
      - if: always()
        run: '"$RUNNER_TEMP/audit/bin/pip-audit" --strict --no-deps -r runtime.txt --progress-spinner off || true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit
          path: pip-audit.json

  # zizmor audits the workflows themselves: template injection, credential
  # persistence, over-broad permissions, dangerous triggers, and actions with
  # known advisories or impostor commits. Findings it should not raise are
  # turned off in .github/zizmor.yml or ignored inline, each with its reason;
  # anything else fails the job.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install zizmor
        run: python -m pip install --require-hashes -r .github/requirements/zizmor.txt

      # The token lets the online audits look up advisories and check that each
      # pinned SHA belongs to the action it names.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          zizmor --format plain .github/workflows || true
          exit "$status"

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  report:
    name: Security report
    needs: [codeql, semgrep, dependencies]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{sarif-*,pip-audit}"
          path: results
          merge-multiple: true
      - name: Write the report
        env:
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          DEPS: ${{ needs.dependencies.result }}
        run: |
          count() { if [ -f "$1" ]; then jq '[.runs[].results[] | select((.suppressions // []) | length == 0)] | length' "$1"; else echo "not run"; fi; }
          vulns=$(if [ -f results/pip-audit.json ]; then jq '[.dependencies[].vulns[]] | length' results/pip-audit.json; else echo "not run"; fi)
          {
            echo "# Security report"
            echo
            echo "Commit \`${GITHUB_SHA}\`, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Check | Result | Findings |"
            echo "| --- | --- | --- |"
            echo "| CodeQL (Python, security-extended) | $CODEQL | $(count results/python.sarif) |"
            echo "| CodeQL (GitHub Actions) | $CODEQL | $(count results/actions.sarif) |"
            echo "| Semgrep (python, security-audit, secrets, github-actions) | $SEMGREP | $(count results/semgrep.sarif) |"
            echo "| pip-audit (runtime dependencies) | $DEPS | $vulns |"
          } > security-report.md
          mkdir -p report && cp security-report.md report/ && cp results/*.sarif results/*.json report/ 2>/dev/null || true
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: report/

  # The one check the ruleset requires from this workflow (see ci.yml).
  security-passed:
    name: Security passed
    if: always()
    needs: [codeql, semgrep, dependencies, zizmor, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
