name: Publish

# Publishes pyvbaanalysis to PyPI when a GitHub Release is published, using PyPI
# Trusted Publishing (OIDC), so no API tokens are stored anywhere.
#
# One-time setup before the first release (see CONTRIBUTING.md for the full steps):
#   1. PyPI -> Account -> Publishing -> add a pending publisher:
#        Project name:     pyvbaanalysis
#        Owner:            WilliamSmithEdward
#        Repository name:  pyVBAanalysis
#        Workflow name:    publish.yml
#        Environment name: pypi
#   2. GitHub -> repo Settings -> Environments -> create an environment named `pypi`.
#
# Started by hand, this is a dry run unless dry_run is unticked: it builds,
# scans and assembles the release files exactly as a release would, and
# uploads them as the release-preview artifact instead of publishing anything.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, scan and assemble the release, but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install package + dev/build tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --require-hashes -r .github/requirements/build.txt
      - name: Test gate (pytest / ruff / mypy)
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m mypy pyvbaanalysis
      - name: Build sdist + wheel
        run: python -m build --no-isolation
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  # CodeQL, Semgrep and pip-audit (security.yml). Any finding fails this job,
  # and publishing waits on it.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write  # upload results to code scanning

  # ClamAV and YARA-X (malware-scan.yml). Any unexpected finding fails this
  # job, and publishing waits on it.
  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml

  publish:
    name: Publish to PyPI
    needs: [build, security, malware-scan]
    if: ${{ github.event_name == 'release' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyvbaanalysis
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # On a dry run `publish` is skipped; this job still bundles the reports as a
  # release would and keeps them, with the distributions, as the
  # release-preview artifact.
  attach-reports:
    name: Attach the reports
    needs: [build, security, malware-scan, publish]
    if: >-
      ${{ !cancelled() && needs.security.result == 'success'
      && needs.malware-scan.result == 'success'
      && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # attach the reports to the release
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: report
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malware-report
          path: malware
      - name: Bundle the raw results
        run: |
          tar -czf security-sarif.tar.gz -C report --exclude security-report.md .
          tar -czf malware-results.tar.gz -C malware --exclude malware-report.md .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.DRY_RUN == 'true'
        with:
          name: dist
          path: dist/

      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/
            report/security-report.md
            malware/malware-report.md
            security-sarif.tar.gz
            malware-results.tar.gz
          if-no-files-found: error

      - name: Upload to the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" report/security-report.md security-sarif.tar.gz \
            malware/malware-report.md malware-results.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
