name: Publish to PyPI

# Publishes pyvbaanalysis to PyPI when a GitHub Release is published, using PyPI
# Trusted Publishing (OIDC), so no API tokens are stored anywhere.
#
# One-time setup before the first release (see CONTRIBUTING.md for the full steps):
#   1. PyPI -> Account -> Publishing -> add a pending publisher:
#        Project name:     pyvbaanalysis
#        Owner:            WilliamSmithEdward
#        Repository name:  pyVBAanalysis
#        Workflow name:    publish.yml
#        Environment name: pypi
#   2. GitHub -> repo Settings -> Environments -> create an environment named `pypi`.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # CodeQL, Semgrep and pip-audit (security.yml). Any finding fails this job,
  # and publishing waits on it.
  security:
    name: Security analysis
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  publish:
    name: Build and publish to PyPI
    needs: security
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyvbaanalysis
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + dev/build tools
        run: python -m pip install -e ".[dev,build]"
      - name: Test gate (pytest / ruff / mypy)
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m mypy pyvbaanalysis
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-security-report:
    name: Attach the security report to the release
    needs: [security, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: security-report
          path: report
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd report
          tar -czf security-sarif.tar.gz *.sarif *.json
          gh release upload "$TAG" security-report.md security-sarif.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
